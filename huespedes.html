<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelControl - Huéspedes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="page-content" hidden>
    <div id="alertas"></div>

    <div class="page-header">
        <div class="page-header-text">
            <span class="page-icon"><i class="bi bi-people"></i></span>
            <div><h2>Gestión de Huéspedes</h2><span class="page-subtitle">Registro y búsqueda de huéspedes del hotel</span></div>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoHuesped"><i class="bi bi-person-plus"></i> Nuevo Huésped</button>
    </div>

    <div class="card mb-4"><div class="card-body">
        <h6 class="fw-bold mb-3"><i class="bi bi-search"></i> Buscar por Cédula / Pasaporte</h6>
        <form id="form-buscar-huesped" class="row g-2">
            <div class="col-auto flex-grow-1"><input type="text" id="busqueda_cedula" class="form-control" placeholder="Ingrese cédula o pasaporte" aria-label="Cédula o pasaporte"></div>
            <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Buscar</button></div>
        </form>
        <div id="resultado-busqueda"></div>
    </div></div>
    <div class="card"><div class="card-body"><div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Cédula / Pasaporte</th><th>Nombre Completo</th><th>Teléfono</th><th>Email</th></tr></thead>
            <tbody id="tabla-huespedes"><tr><td colspan="4" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
    </div></div></div>

<div class="modal fade" id="modalNuevoHuesped" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="form-nuevo-huesped">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-person-plus"></i> Registrar Huésped</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label class="form-label" for="cedula_pasaporte">Cédula / Pasaporte</label><input type="text" id="cedula_pasaporte" class="form-control" required></div>
            <div class="mb-3"><label class="form-label" for="nombre_completo">Nombre Completo</label><input type="text" id="nombre_completo" class="form-control" required></div>
            <div class="mb-3"><label class="form-label" for="telefono">Teléfono</label><input type="text" id="telefono" class="form-control"></div>
            <div class="mb-3"><label class="form-label" for="email_huesped">Email</label><input type="email" id="email_huesped" class="form-control"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
    </form>
</div></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/huespedes.js"></script>
</body>
</html>
