<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelControl - Asignación de rol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-body">
<div class="container px-3">
    <div class="card wait-card" id="tarjeta" aria-live="polite">
        <div class="wait-icon" id="icono"><i class="bi bi-hourglass-split"></i></div>
        <h1 class="h3" id="titulo">Cuenta creada</h1>
        <p class="text-muted mb-3" id="saludo">Cargando…</p>
        <div class="mb-3" id="estado-rol"></div>
        <p class="text-muted" id="mensaje"></p>
        <div class="d-grid gap-2 mt-4">
            <button class="btn btn-primary d-none" id="btn-continuar"><i class="bi bi-arrow-right-circle"></i> Continuar al sistema</button>
            <button class="btn btn-outline-primary" id="btn-actualizar"><i class="bi bi-arrow-clockwise"></i> Verificar de nuevo</button>
            <a href="#" class="btn btn-secondary" data-logout><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
async function refrescar() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return window.location.replace("index.html");
    const perfil = await obtenerPerfil(session.user.id);
    if (!perfil) { await supabaseClient.auth.signOut(); return window.location.replace("index.html"); }

    const nombre = perfil.nombre || perfil.username;
    document.getElementById("saludo").textContent = `Hola, ${nombre}.`;
    document.getElementById("estado-rol").innerHTML = badgeRol(perfil.rol);

    const espera = perfil.rol === ROL_ESPERA;
    document.getElementById("titulo").textContent = espera ? "Asignación de rol en espera" : "¡Rol asignado!";
    document.getElementById("icono").innerHTML = espera
        ? '<i class="bi bi-hourglass-split"></i>' : '<i class="bi bi-patch-check"></i>';
    document.getElementById("mensaje").textContent = espera
        ? "Un administrador debe asignarte el rol de Administrador o Recepcionista para que puedas usar el sistema. Esta pantalla se actualiza sola."
        : `Un administrador te asignó el rol de ${perfil.rol}. Ya puedes ingresar.`;
    document.getElementById("btn-continuar").classList.toggle("d-none", espera);
    document.getElementById("btn-actualizar").classList.toggle("d-none", !espera);
    document.getElementById("btn-continuar").onclick = () => {
        sessionStorage.setItem("bienvenida", "1");
        window.location.replace(rutaInicial(perfil.rol));
    };
    return perfil;
}
document.getElementById("btn-actualizar").addEventListener("click", refrescar);
refrescar();
setInterval(() => { if (!document.hidden) refrescar(); }, 8000);
</script>
</body>
</html>
