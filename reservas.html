<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelControl - Reservaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="page-content" hidden>
    <div id="alertas"></div>

    <div class="page-header">
        <div class="page-header-text">
            <span class="page-icon"><i class="bi bi-calendar-check"></i></span>
            <div><h2>Gestión de Reservaciones</h2><span class="page-subtitle">Reserva, cobro, check-in y check-out</span></div>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaReserva"><i class="bi bi-plus-circle"></i> Nueva Reservación</button>
    </div>

    <div class="card"><div class="card-body"><div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Huésped</th><th>Habitación</th><th>Entrada</th><th>Salida</th><th>Monto</th><th>Estado</th><th>Pago</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="tabla-reservas"><tr><td colspan="8" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
    </div></div></div>

<!-- Nueva reservación -->
<div class="modal fade" id="modalNuevaReserva" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="form-nueva-reserva">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-calendar-plus"></i> Nueva Reservación</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label class="form-label" for="huesped_id">Huésped</label><select id="huesped_id" class="form-select" required><option value="" disabled selected>Seleccione un huésped</option></select></div>
            <div class="mb-3"><label class="form-label" for="habitacion_id">Habitación Disponible</label><select id="habitacion_id" class="form-select" required><option value="" disabled selected>Seleccione una habitación</option></select></div>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label" for="fecha_entrada">Fecha de Entrada</label><input type="date" id="fecha_entrada" class="form-control" required></div>
                <div class="col-md-6 mb-3"><label class="form-label" for="fecha_salida">Fecha de Salida</label><input type="date" id="fecha_salida" class="form-control" required></div>
            </div>
            <p class="text-muted small mb-0"><i class="bi bi-info-circle"></i> El monto se calcula por noches. Al finalizar podrás cobrar y generar la factura.</p>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Continuar al pago</button></div>
    </form>
</div></div></div>

<!-- Pago -->
<div class="modal fade" id="modalPago" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form id="form-pago">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-credit-card"></i> Procesar pago</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
            <div class="pay-summary mb-4">
                <div class="small text-muted" id="pago-resumen"></div>
                <div class="pay-total" id="pago-total">$0.00</div>
            </div>
            <fieldset class="mb-3"><legend class="form-label fs-6">Método de pago</legend>
                <div class="pay-methods"><div class="pay-method"><input type="radio" name="metodo" id="metodo-0" value="Efectivo" checked><label for="metodo-0"><i class="bi bi-cash-stack"></i>Efectivo</label></div><div class="pay-method"><input type="radio" name="metodo" id="metodo-1" value="Tarjeta" ><label for="metodo-1"><i class="bi bi-credit-card-2-front"></i>Tarjeta</label></div><div class="pay-method"><input type="radio" name="metodo" id="metodo-2" value="Transferencia" ><label for="metodo-2"><i class="bi bi-bank"></i>Transferencia</label></div><div class="pay-method"><input type="radio" name="metodo" id="metodo-3" value="Pago móvil" ><label for="metodo-3"><i class="bi bi-phone"></i>Pago móvil</label></div><div class="pay-method"><input type="radio" name="metodo" id="metodo-4" value="Zelle" ><label for="metodo-4"><i class="bi bi-currency-dollar"></i>Zelle</label></div></div>
            </fieldset>
            <div class="mb-1" id="grupo-referencia" hidden>
                <label class="form-label" for="pago-referencia">Número de referencia</label>
                <input type="text" id="pago-referencia" class="form-control" maxlength="40" autocomplete="off">
            </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Pagar después</button><button type="submit" class="btn btn-primary"><i class="bi bi-receipt"></i> Cobrar y facturar</button></div>
    </form>
</div></div></div>

<!-- Historial -->
<div class="modal fade" id="modalHistorial" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-clock-history"></i> Movimientos de la reservación</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body" id="historial-cuerpo"></div>
</div></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/factura.js"></script>
<script src="js/reservas.js"></script>
</body>
</html>
