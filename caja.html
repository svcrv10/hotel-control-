<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelControl - Cierre de caja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="page-content" hidden>
    <div id="alertas"></div>

    <div class="page-header">
        <div class="page-header-text">
            <span class="page-icon"><i class="bi bi-safe2"></i></span>
            <div><h2>Cierre de caja</h2><span class="page-subtitle">Pagos de reservaciones agrupados por método de pago</span></div>
        </div>
        
    </div>

    <div class="card mb-4"><div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-4"><label class="form-label" for="caja-fecha">Fecha a cerrar</label><input type="date" id="caja-fecha" class="form-control"></div>
            <div class="col-md-8 text-md-end"><button class="btn btn-primary" id="btn-cerrar-caja" disabled><i class="bi bi-lock"></i> Realizar cierre de caja</button></div>
        </div>
        <div id="aviso-otros" class="mt-3"></div>
    </div></div>

    <div class="row g-4 mb-4">
        <div class="col-lg-5"><div class="card h-100"><div class="card-body">
            <h5 class="card-title fw-bold"><i class="bi bi-pie-chart"></i> Resumen por método</h5>
            <table class="table align-middle mt-2"><thead><tr><th>Método</th><th class="text-end">Pagos</th><th class="text-end">Total</th></tr></thead>
                <tbody id="caja-resumen"><tr><td colspan="3" class="text-center text-muted py-3">Cargando...</td></tr></tbody>
                <tfoot><tr><th>Total del día</th><th class="text-end" id="caja-cant">0</th><th class="text-end fs-5" id="caja-total">$0.00</th></tr></tfoot>
            </table>
        </div></div></div>
        <div class="col-lg-7"><div class="card h-100"><div class="card-body">
            <h5 class="card-title fw-bold"><i class="bi bi-list-check"></i> Pagos del día sin cerrar</h5>
            <div class="table-responsive"><table class="table table-hover align-middle mt-2">
                <thead><tr><th>Hora</th><th>Huésped</th><th>Hab.</th><th>Método</th><th>Ref.</th><th class="text-end">Monto</th></tr></thead>
                <tbody id="caja-pagos"><tr><td colspan="6" class="text-center text-muted py-3">Cargando...</td></tr></tbody>
            </table></div>
        </div></div></div>
    </div>

    <div class="card"><div class="card-body">
        <h5 class="card-title fw-bold"><i class="bi bi-clock-history"></i> Cierres realizados</h5>
        <div class="table-responsive"><table class="table table-hover align-middle mt-2">
            <thead><tr><th>N°</th><th>Fecha</th><th>Realizado</th><th class="text-end">Pagos</th><th class="text-end">Total</th><th class="text-end">Reporte</th></tr></thead>
            <tbody id="tabla-cierres"><tr><td colspan="6" class="text-center text-muted py-3">Cargando...</td></tr></tbody>
        </table></div>
    </div></div>

<div class="modal fade" id="modalCierre" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-safe2"></i> Reporte de cierre de caja</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body" id="cierre-cuerpo"></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button type="button" class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button></div>
</div></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/caja.js"></script>
</body>
</html>
