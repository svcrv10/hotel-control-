<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelControl - Facturas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="page-content" hidden>
    <div id="alertas"></div>

    <div class="page-header">
        <div class="page-header-text">
            <span class="page-icon"><i class="bi bi-receipt"></i></span>
            <div><h2>Facturas</h2><span class="page-subtitle">Historial de facturas emitidas</span></div>
        </div>
        
    </div>

    <div class="row g-4 mb-4">
        <div class="col-sm-6"><div class="card metric-card"><div class="card-body"><p class="text-muted mb-1 small">Facturas emitidas</p><h3 class="fw-bold mb-0" id="f-cantidad">0</h3></div></div></div>
        <div class="col-sm-6"><div class="card metric-card"><div class="card-body"><p class="text-muted mb-1 small">Total facturado</p><h3 class="fw-bold mb-0" id="f-total">$0.00</h3></div></div></div>
    </div>
    <div class="card"><div class="card-body">
        <div class="mb-3"><input type="search" id="buscar-factura" class="form-control" placeholder="Buscar por N° de factura o huésped" aria-label="Buscar factura"></div>
        <div class="table-responsive"><table class="table table-hover align-middle">
            <thead><tr><th>N°</th><th>Fecha</th><th>Huésped</th><th>Habitación</th><th>Método</th><th>Total</th><th class="text-end">Factura</th></tr></thead>
            <tbody id="tabla-facturas"><tr><td colspan="7" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table></div>
    </div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/factura.js"></script>
<script src="js/facturas.js"></script>
</body>
</html>
