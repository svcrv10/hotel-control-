<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelControl - Habitaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="page-content" hidden>
    <div id="alertas"></div>

    <div class="page-header">
        <div class="page-header-text">
            <span class="page-icon"><i class="bi bi-door-closed"></i></span>
            <div><h2>Gestión de Habitaciones</h2><span class="page-subtitle">Inventario, tarifas y estado de cada habitación</span></div>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaHabitacion"><i class="bi bi-plus-circle"></i> Nueva Habitación</button>
    </div>

    <div class="card"><div class="card-body"><div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Número</th><th>Tipo</th><th>Precio / Noche</th><th>Estado</th><th class="text-end">Cambiar estado</th></tr></thead>
            <tbody id="tabla-habitaciones"><tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
    </div></div></div>

<div class="modal fade" id="modalNuevaHabitacion" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="form-nueva-habitacion">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-door-open me-1"></i> Registrar Habitación</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label class="form-label" for="numero">Número de Habitación</label><input type="text" id="numero" class="form-control" required></div>
            <div class="mb-3"><label class="form-label" for="tipo">Tipo</label>
                <select id="tipo" class="form-select" required><option>Individual</option><option>Doble</option><option>Matrimonial</option><option>Suite</option></select></div>
            <div class="mb-3"><label class="form-label" for="precio_noche">Precio por Noche ($)</label><input type="number" step="0.01" min="0.01" id="precio_noche" class="form-control" required></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
    </form>
</div></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/habitaciones.js"></script>
</body>
</html>
